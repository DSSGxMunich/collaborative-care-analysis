[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "collaborative_care_analysis"
version = "0.0.1"
description = "Depression Treatment Navigator for Primary Care"
authors = [
  { name = "DSSGx Munich 2026 team" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "pandas>=2.3.3",
    "pip",
    "pyreadstat>=1.3.5",
    "python-dotenv",
    "tqdm",
    "typer",
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["collaborative_care_analysis"]
include = ["pyproject.toml", "collaborative_care_analysis/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["collaborative_care_analysis"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

