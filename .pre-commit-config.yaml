repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: sh -c "echo '🔍 Running ruff check...' && uv run ruff check --fix"
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: sh -c "echo '✨ Running ruff format...' && uv run ruff format"
        language: system
        types: [python]

      - id: run-pipeline
        name: run pipeline
        entry: sh -c "echo '🚀 Running pipeline...' && uv run collaborative_care_analysis/dataset.py run"
        language: system
        stages: [pre-commit]
        pass_filenames: false
        verbose: true

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      - id: uv-lock